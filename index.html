<!doctype html>
<html lang="en" data-look="dawn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Aethel</title>
  <meta name="theme-color" content="#05070c">
  <link rel="icon" href="assets/mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=Jost:wght@400&display=swap" rel="stylesheet">
  <style>
    :root { --ink: #05070c; --text: #f4efe6; --mute: rgba(244, 239, 230, .55); --pad: clamp(18px, 3.2vw, 40px); }
    * { box-sizing: border-box; margin: 0; }
    html { background: var(--ink); scroll-behavior: smooth; }
    body { background: var(--ink); color: var(--text); }
    body { font: 400 12px/1.4 "IBM Plex Mono", ui-monospace, monospace; -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; }
    /* SECTION 2: a quiet bridge between the film and the footer. Same dot language as the footer. */
    .bridge { position: relative; height: 100svh; min-height: 480px; background: var(--ink); overflow: hidden; }
    #waves { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .bridge p {
      position: absolute; left: 50%; top: 24%; transform: translateX(-50%); width: min(900px, calc(100% - 2 * var(--pad))); text-align: center;
      font: 400 clamp(26px, 4.4vw, 60px)/1.15 "Jost", system-ui, sans-serif; letter-spacing: -.005em;
      opacity: 0; transition: opacity 1.4s ease .3s;
    }
    .bridge.in p { opacity: 1; }
    @media (prefers-reduced-motion: reduce) { .bridge p { transition: none; opacity: 1; } }

    /* SECTION 1: the film. Laptop file on wide screens, phone file on tall screens. */
    .film { position: relative; height: 100svh; background: #000; overflow: hidden; }
    .film video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
    .film button, .cue { font: inherit; color: var(--text); letter-spacing: .04em; }
    .sound {
      position: absolute; left: var(--pad); bottom: max(var(--pad), env(safe-area-inset-bottom)); z-index: 2;
      display: flex; align-items: center; gap: 10px; padding: 10px 14px; cursor: pointer;
      background: rgba(5, 7, 12, .35); border: 1px solid rgba(244, 239, 230, .35); border-radius: 999px;
      -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    }
    .sound:hover { border-color: var(--text); }
    .sound i { display: inline-flex; align-items: flex-end; gap: 2px; height: 12px; }
    .sound i b { width: 2px; background: currentColor; height: 4px; }
    .sound[aria-pressed="true"] i b { animation: eq .9s ease-in-out infinite; }
    .sound[aria-pressed="true"] i b:nth-child(2) { animation-delay: .15s; }
    .sound[aria-pressed="true"] i b:nth-child(3) { animation-delay: .3s; }
    @keyframes eq { 0%, 100% { height: 3px; } 50% { height: 12px; } }
    .cue {
      position: absolute; right: var(--pad); bottom: max(var(--pad), env(safe-area-inset-bottom)); z-index: 2;
      background: none; border: 0; cursor: pointer; color: var(--mute); padding: 10px 0;
    }
    .cue:hover { color: var(--text); }

    /* SECTION 2: one line under the wordmark. Space is kept; the words are added later. */
    .line {
      position: absolute; left: 50%; top: calc(50% + clamp(44px, 8vw, 120px)); transform: translateX(-50%);
      width: min(640px, calc(100% - 2 * var(--pad))); min-height: 3.2em; text-align: center;
      font: 400 clamp(14px, 1.5vw, 18px)/1.5 "Jost", system-ui, sans-serif; letter-spacing: .02em; color: var(--mute);
    }

    /* SECTION 3: footer. The wordmark is made of dots that move away from the pointer. */
    .site-footer { position: relative; height: 100svh; min-height: 480px; background: var(--ink); overflow: hidden; }
    #dots { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: pan-y; }
    .site-footer .row {
      position: absolute; left: var(--pad); right: var(--pad); z-index: 1; display: flex; justify-content: space-between; gap: 16px;
      color: var(--mute); letter-spacing: .04em; pointer-events: none;
    }
    .site-footer .row a { pointer-events: auto; }
    .site-footer .row a:hover { color: var(--text); }
    .site-footer .top { top: var(--pad); }
    .site-footer .bottom { bottom: max(var(--pad), env(safe-area-inset-bottom)); }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .sound i b { animation: none !important; } }
  </style>
</head>
<body>
  <section class="film" id="film" aria-label="Aethel teaser film">
    <video id="teaser" muted playsinline preload="auto" autoplay poster="assets/video/teaser-16x9.jpg"></video>
    <button class="sound" id="sound" type="button" aria-pressed="false" aria-label="Turn sound on">
      <i aria-hidden="true"><b></b><b></b><b></b></i><span>Sound off</span>
    </button>
    <button class="cue" id="cue" type="button">Scroll</button>
  </section>

  <section class="bridge" id="bridge" aria-label="Aethel">
    <canvas id="waves" aria-hidden="true"></canvas>
    <!-- ONE LINE: swap the words here. -->
    <p>Autonomous aircraft for offshore infrastructure.</p>
  </section>
  <footer class="site-footer" id="footer">
    <canvas id="dots" role="img" aria-label="AETHEL"></canvas>
    <div class="row top">
      <a href="mailto:nivin@aethelcorp.com">Contact</a>
      <span></span>
    </div>
    <div class="row bottom">
      <span>© 2026 Aethel</span>
      <a href="#film" id="replay">Back to the film</a>
    </div>
  </footer>
  <script>
    (() => {
      const cv = document.getElementById('dots'), ctx = cv.getContext('2d');
      const foot = document.getElementById('footer');
      const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
      let W = 0, H = 0, dpr = 1, P = [], mx = -1e4, my = -1e4, R = 120, vis = false, raf = 0, t0 = 0, r = 2;

      const build = async () => {
        try { await document.fonts.load('400 200px Jost'); } catch (e) {}
        dpr = Math.min(devicePixelRatio || 1, 2);
        W = foot.clientWidth; H = foot.clientHeight;
        cv.width = W * dpr; cv.height = H * dpr;
        const pad = Math.max(18, Math.min(40, innerWidth * .032));
        // Fit the word to the width.
        const probe = document.createElement('canvas').getContext('2d');
        let size = 200; probe.font = `400 ${size}px Jost, sans-serif`;
        const sp = .08; // letter spacing in em
        const word = 'AETHEL';
        const width = () => probe.measureText(word).width + sp * size * (word.length - 1);
        size = size * (W - 2 * pad) / width();
        const m = document.createElement('canvas'); m.width = W; m.height = H;
        const mc = m.getContext('2d', { willReadFrequently: true });
        mc.fillStyle = '#fff'; mc.textBaseline = 'alphabetic';
        mc.font = `400 ${size}px Jost, sans-serif`;
        let x = pad; const base = H * .62 + size * .36;
        mc.strokeStyle = '#fff'; mc.lineJoin = 'round'; mc.lineWidth = size * .035; // a little weight so the dots read as solid letters
        for (const ch of word) { mc.fillText(ch, x, base); mc.strokeText(ch, x, base); x += mc.measureText(ch).width + sp * size; }
        const step = Math.max(4, Math.min(7, Math.round(W / 230)));
        r = step * .4; R = Math.max(90, Math.min(170, W * .11));
        const d = mc.getImageData(0, 0, W, H).data;
        P = [];
        for (let y = step / 2; y < H; y += step) for (let xx = step / 2; xx < W; xx += step) {
          if (d[((y | 0) * W + (xx | 0)) * 4 + 3] > 128) {
            const j = () => (Math.random() - .5) * step * .5;
            P.push({ hx: xx + j() * .4, hy: y + j() * .4, x: Math.random() * W, y: H + Math.random() * H * .6, vx: 0, vy: 0,
                     a: .55 + Math.random() * .45, delay: Math.random() * 900 + (xx / W) * 700 });
          }
        }
        if (reduced) P.forEach(p => { p.x = p.hx; p.y = p.hy; });
        t0 = performance.now(); draw(t0);
      };

      const draw = now => {
        raf = 0;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, W, H);
        ctx.fillStyle = '#f4efe6';
        const el = now - t0, R2 = R * R;
        for (const p of P) {
          if (!reduced) {
            if (el > p.delay) {
              const dx = p.x - mx, dy = p.y - my, d2 = dx * dx + dy * dy;
              if (d2 < R2 && d2 > .01) { const d = Math.sqrt(d2), f = (1 - d / R) * 2.4; p.vx += dx / d * f; p.vy += dy / d * f; }
              p.vx += (p.hx - p.x) * .035; p.vy += (p.hy - p.y) * .035;
              p.vx *= .86; p.vy *= .86; p.x += p.vx; p.y += p.vy;
            }
          }
          ctx.globalAlpha = p.a;
          ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, 6.2832); ctx.fill();
        }
        ctx.globalAlpha = 1;
        if (vis && !reduced) raf = requestAnimationFrame(draw);
      };
      const kick = () => { if (!raf) raf = requestAnimationFrame(draw); };

      const move = e => { const b = cv.getBoundingClientRect(); mx = e.clientX - b.left; my = e.clientY - b.top; };
      cv.addEventListener('pointermove', move);
      cv.addEventListener('pointerdown', move);
      cv.addEventListener('pointerleave', () => { mx = my = -1e4; });
      cv.addEventListener('pointerup', e => { if (e.pointerType !== 'mouse') mx = my = -1e4; });

      let started = false;
      new IntersectionObserver(([e]) => {
        vis = e.isIntersecting;
        if (vis) { if (!started) { started = true; t0 = performance.now(); P.forEach(p => { p.x = Math.random() * W; p.y = H + Math.random() * H * .6; p.vx = p.vy = 0; }); } kick(); }
      }, { threshold: .25 }).observe(foot);

      let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { started = vis; build().then(kick); }, 150); });
      build();
    })();
  </script>
  <script>
    // Bridge: a calm sea of dots (the footer's language). One orange point crosses the gap once.
    (() => {
      const sec = document.getElementById('bridge'), cv = document.getElementById('waves'), ctx = cv.getContext('2d');
      const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
      let W = 0, H = 0, dpr = 1, y0 = 0, vis = false, raf = 0, tStart = -1;
      const size = () => { dpr = Math.min(devicePixelRatio || 1, 2); W = sec.clientWidth; H = sec.clientHeight; cv.width = W * dpr; cv.height = H * dpr; y0 = H * .58; };
      const arc = u => { // quadratic path from the coast (left) over the gap to the platform (right)
        const x0 = W * .08, x1 = W * .92, cx = W * .5, cy = y0 - H * .3, y = y0 - 2;
        return [(1 - u) * (1 - u) * x0 + 2 * (1 - u) * u * cx + u * u * x1, (1 - u) * (1 - u) * y + 2 * (1 - u) * u * cy + u * u * y];
      };
      const ease = u => u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
      const draw = now => {
        raf = 0;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
        const t = reduced ? 0 : now / 1000, rows = Math.round(H / 22);
        ctx.fillStyle = '#f4efe6';
        for (let i = 0; i < rows; i++) {
          const k = i / (rows - 1), y = y0 + (H - y0) * Math.pow(k, 1.7), sp = 6 + k * 18, amp = .6 + k * 7;
          ctx.globalAlpha = .12 + .6 * k; const r = .5 + k * 1.5;
          ctx.beginPath();
          for (let x = (i % 2) * sp / 2; x < W; x += sp) {
            const yy = y + Math.sin(x * .011 + t * .8 + i * .55) * amp;
            ctx.moveTo(x + r, yy); ctx.arc(x, yy, r, 0, 6.2832);
          }
          ctx.fill();
        }
        // the crossing: starts 0.9 s after the bridge comes into view, takes 2.4 s, then rests at the platform
        let u = reduced ? 1 : tStart < 0 ? 0 : Math.max(0, Math.min(1, (now - tStart - 900) / 2400));
        if (u > 0) {
          const e = ease(u); ctx.globalAlpha = .75; ctx.fillStyle = '#f4efe6';
          for (let j = 0; j < 90; j++) { const v = (j / 90) * e; const [x, y] = arc(v); ctx.beginPath(); ctx.arc(x, y, .9, 0, 6.2832); ctx.fill(); }
          const [px, py] = arc(e); ctx.globalAlpha = 1; ctx.fillStyle = '#ff8a3d'; ctx.beginPath(); ctx.arc(px, py, 4, 0, 6.2832); ctx.fill();
        }
        ctx.globalAlpha = 1;
        if (vis && !reduced) raf = requestAnimationFrame(draw);
      };
      new IntersectionObserver(([e]) => {
        vis = e.isIntersecting;
        sec.classList.toggle('in', vis);
        if (vis) { tStart = performance.now(); if (!raf) raf = requestAnimationFrame(draw); }
        else if (!reduced) tStart = -1; // plays again next time it comes into view
      }, { threshold: .4 }).observe(sec);
      addEventListener('resize', () => { size(); if (!raf) raf = requestAnimationFrame(draw); });
      size(); raf = requestAnimationFrame(draw);
    })();
  </script>
  <script>
    (() => {
      const v = document.getElementById('teaser'), btn = document.getElementById('sound'), cue = document.getElementById('cue');
      const sea = document.getElementById('bridge');
      const files = { wide: 'assets/video/teaser-16x9', tall: 'assets/video/teaser-9x16' };
      const kind = () => (innerHeight > innerWidth ? 'tall' : 'wide');
      let cur = '';
      const load = () => {
        const k = kind(); if (k === cur) return;
        const t = cur ? v.currentTime : 0, wasPlaying = !v.paused && !v.ended; cur = k;
        v.poster = files[k] + '.jpg'; v.src = files[k] + '.mp4';
        v.addEventListener('loadedmetadata', () => { if (t) v.currentTime = Math.min(t, v.duration - .05); if (wasPlaying || !t) v.play().catch(() => {}); }, { once: true });
      };
      load();
      addEventListener('resize', load);

      // Sound: browsers only allow it after a tap, so it starts off with a button.
      const setSound = on => {
        v.muted = !on; btn.setAttribute('aria-pressed', on);
        btn.setAttribute('aria-label', on ? 'Turn sound off' : 'Turn sound on');
        btn.querySelector('span').textContent = on ? 'Sound on' : 'Sound off';
      };
      btn.addEventListener('click', () => { setSound(v.muted); if (v.ended && !v.muted) { v.currentTime = 0; } v.play().catch(() => {}); });

      // When the film ends, move down to the bridge (only if the visitor is still on the film).
      const down = () => sea.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
      cue.addEventListener('click', down);
      v.addEventListener('ended', () => { if (scrollY < innerHeight * .3) setTimeout(() => { if (scrollY < innerHeight * .3) down(); }, 600); });

      // Do not play in the background once the visitor has scrolled away.
      new IntersectionObserver(([e]) => { if (!e.isIntersecting) v.pause(); else if (!v.ended) v.play().catch(() => {}); }, { threshold: .15 }).observe(document.getElementById('film'));
    })();
  </script>
</body>
</html>
